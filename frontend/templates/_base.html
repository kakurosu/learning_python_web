<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Study Python for Finance{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <style>
    /* Inline minimal reset until Tailwind is bundled. The visual layer
       gets a proper sweep in Phase 4 alongside Tailwind + Alpine. */
    :root {
      --bg:       #0A0A0A;
      --surface:  #141414;
      --surface2: #1C1C1C;
      --ink:      #F5F5F5;
      --ink2:     #D4D4D4;
      --ink3:     #A3A3A3;
      --ink4:     #737373;
      --line:     #262626;
      --accent:   #EF4444;
      --accent2:  #F87171;
      --success:  #10B981;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
                 font-family: 'Inter Variable', 'Inter', 'Segoe UI', sans-serif;
                 height: 100%; }
    a { color: inherit; text-decoration: none; }

    .shell { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
    .sidebar { background: var(--surface2); border-right: 1px solid var(--line);
               display: flex; flex-direction: column; }
    .sidebar .brand { padding: 18px; border-bottom: 1px solid var(--line);
                      display: flex; align-items: center; gap: 10px; }
    .sidebar .brand .badge { width: 22px; height: 22px; background: var(--accent); }
    .sidebar .brand .wordmark { font-weight: 800; line-height: 1; font-size: 13px; }
    .sidebar .brand .wordmark .sub { color: var(--ink3); font-weight: 600; }
    .sidebar nav { padding: 18px 12px; }
    .sidebar nav a { display: block; padding: 8px 14px 8px 16px; color: var(--ink2);
                     border-left: 2px solid transparent; font-size: 13px; font-weight: 600; }
    .sidebar nav a:hover { color: var(--accent); border-left-color: var(--accent); }
    .sidebar nav a.active { color: var(--ink); border-left-color: var(--accent);
                            background: rgba(239, 68, 68, 0.08); font-weight: 700; }
    .sidebar nav .group { color: var(--ink4); font-size: 10px; font-weight: 800;
                          letter-spacing: 0.6px; padding: 14px 8px 6px 8px; }

    .main { display: flex; flex-direction: column; }
    .content { flex: 1; overflow: auto; padding: 28px 40px 40px; }
    .statusbar { height: 28px; border-top: 1px solid var(--line); display: flex;
                 align-items: center; padding: 0 20px; gap: 18px;
                 font-family: 'JetBrains Mono', 'Cascadia Mono', monospace;
                 font-size: 11px; color: var(--ink4); letter-spacing: 0.3px; }
    .statusbar .dot { width: 6px; height: 6px; background: var(--success); }
    .statusbar .kernel-state { color: var(--ink3); }

    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.6px; margin: 0; }
    h2 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
    p.lead { color: var(--ink3); font-size: 14px; margin: 4px 0 24px; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="badge"></div>
        <div class="wordmark">Study Python<br/><span class="sub">for Finance</span></div>
      </div>
      <nav>
        <div class="group">学習</div>
        <a href="/"          class="{% if active == 'dashboard' %}active{% endif %}">▣ ダッシュボード</a>
        <a href="/chapters"  class="{% if active == 'chapters'  %}active{% endif %}">□ 章を学ぶ</a>
        <a href="/practice"  class="{% if active == 'practice'  %}active{% endif %}">◇ 練習問題</a>
        <a href="/tests"     class="{% if active == 'tests'     %}active{% endif %}">✓ 実力テスト</a>
        <a href="/history"   class="{% if active == 'history'   %}active{% endif %}">≡ 学習履歴</a>
        <div class="group">補助</div>
        <a href="/references" class="{% if active == 'references' %}active{% endif %}">✎ リファレンス</a>
        <a href="/settings"   class="{% if active == 'settings'   %}active{% endif %}">⚙ 設定</a>
      </nav>
    </aside>

    <main class="main">
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="statusbar">
        <div class="dot"></div>
        <div class="kernel-state">kernel: ready</div>
        <div>Python 3.12</div>
        <div>UTF-8</div>
        <div>LF</div>
        <div style="margin-left: auto;">Study Python for Finance · v0.1 (web)</div>
      </div>
    </main>

  </div>
</body>
</html>
