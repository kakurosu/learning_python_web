[project]
name = "learning-python-web"
version = "0.1.0"
description = "Study Python for Finance — Web UI edition (FastAPI + pywebview)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web shell
    "pywebview>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",

    # Kernel + grading (re-used from the PyQt6 version, no UI deps)
    "jupyter_client>=8.6",
    "ipykernel>=6.29",

    # Data / DB
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Pygments>=2.17",

    # LLM (Anthropic for Ask AI, OpenAI for chapter content)
    "anthropic>=0.34",
    "openai>=1.40",
    "python-dotenv>=1.0",

    # Numerical / financial libs used by the chapters themselves
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",

    # Web scraping (chapter 27)
    "requests>=2.31",
    "beautifulsoup4>=4.12",

    # Streamlit (chapter 30 launches it from the kernel)
    "streamlit>=1.32",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
automation = ["pyautogui>=0.9.54", "playwright>=1.42"]

[project.scripts]
study-python-web = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backend"]
