{% extends "_base.html" %}
{% block title %}Chapters · Study Python for Finance{% endblock %}
{% block content %}
  <h1>章を選ぶ</h1>
  <p class="lead">全章一覧。クリックで開く（次フェーズで章ビュー実装）。</p>

  <div id="chapter-list" style="display: grid; gap: 10px; max-width: 920px;">読み込み中...</div>

  <script>
    fetch("/api/chapters")
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById("chapter-list");
        list.innerHTML = "";
        for (const ch of data) {
          const row = document.createElement("div");
          row.style.cssText =
            "border-bottom: 1px solid var(--line); padding: 12px 4px;" +
            " display: grid; grid-template-columns: 32px 1fr 120px 110px;" +
            " gap: 14px; align-items: center; font-size: 14px;";
          const status = {
            completed: "● Done",
            in_progress: "● In progress",
            not_started: "○ Not started",
          }[ch.status] || "—";
          const statusColor = {
            completed: "var(--success)",
            in_progress: "var(--accent)",
            not_started: "var(--ink4)",
          }[ch.status] || "var(--ink4)";
          row.innerHTML =
            `<div style="color: var(--ink4); font-family: 'JetBrains Mono', monospace;">${String(ch.id).padStart(2,'0')}</div>` +
            `<div><div style="font-weight: 700;">${ch.title}</div>` +
            `<div style="color: var(--ink3); font-size: 12px;">${(ch.learning_goals[0]||"")}</div></div>` +
            `<div style="color: var(--ink4); font-size: 11px;">Phase ${ch.phase}</div>` +
            `<div style="color: ${statusColor}; font-size: 11px; font-weight: 800;">${status}</div>`;
          list.appendChild(row);
        }
      });
  </script>
{% endblock %}
