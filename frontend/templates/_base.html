<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Study Python for Finance{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="badge"></div>
        <div class="wordmark">
          Study Python
          <span class="sub">for Finance</span>
        </div>
      </div>
      <nav>
        <div class="group">学習</div>
        <a href="/"           class="{% if active == 'dashboard' %}active{% endif %}">
          <span class="ico">▣</span> ダッシュボード
        </a>
        <a href="/chapters"   class="{% if active == 'chapters'  %}active{% endif %}">
          <span class="ico">□</span> 章を学ぶ
        </a>
        <a href="/practice"   class="{% if active == 'practice'  %}active{% endif %}">
          <span class="ico">◇</span> 練習問題
        </a>
        <a href="/tests"      class="{% if active == 'tests'     %}active{% endif %}">
          <span class="ico">✓</span> 実力テスト
        </a>
        <a href="/history"    class="{% if active == 'history'   %}active{% endif %}">
          <span class="ico">≡</span> 学習履歴
        </a>
        <div class="group">補助</div>
        <a href="/references" class="{% if active == 'references' %}active{% endif %}">
          <span class="ico">✎</span> リファレンス
        </a>
        <a href="/settings"   class="{% if active == 'settings'   %}active{% endif %}">
          <span class="ico">⚙</span> 設定
        </a>
      </nav>
    </aside>

    <main class="main">
      {% block main %}
        <div class="content">
          {% block content %}{% endblock %}
        </div>
      {% endblock %}
      <div class="statusbar">
        <div class="dot"></div>
        <div class="kernel-state">kernel: ready</div>
        <div>Python 3.12</div>
        <div>UTF-8</div>
        <div>LF</div>
        <div style="margin-left: auto;">Study Python for Finance · v0.1 (web)</div>
      </div>
    </main>

  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
